<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept A — आयुध चक्र</title>
<style>
  :root {
    --color-bg: #fbf1de;
    --color-surface: #fff9ec;
    --color-text: #3a0f16;
    --color-muted: #7a5c46;
    --color-primary: #7a1e2b;
    --color-primary-hover: #611722;
    --color-gold: #8f6224;
    --color-gold-soft: rgba(143, 98, 36, 0.14);
    --color-border: rgba(143, 98, 36, 0.32);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--color-text);
    background:
      radial-gradient(900px 480px at 8% -8%, var(--color-gold-soft), transparent 55%),
      var(--color-bg);
    min-height: 100vh;
  }
  .demo-banner {
    background: var(--color-primary);
    color: #f6e6c4;
    text-align: center;
    font-size: 0.8rem;
    padding: 0.5rem;
    letter-spacing: 0.02em;
  }
  .demo-banner a { color: #fff; }
  header {
    text-align: center;
    padding: 2rem 1rem 0.5rem;
  }
  .eyebrow {
    color: var(--color-gold);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }
  h1 {
    color: var(--color-primary);
    font-size: 2rem;
    margin: 0.35rem 0 0.4rem;
  }
  .lead { color: var(--color-muted); font-size: 0.95rem; margin: 0 0 1.5rem; }

  .wheel-wrap {
    position: relative;
    width: min(94vw, 640px);
    aspect-ratio: 1 / 1;
    margin: 0 auto 2rem;
  }
  svg.spokes { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.spokes line { stroke: var(--color-border); stroke-width: 1; }

  .center-medallion {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--color-primary);
    border: 3px solid var(--color-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f6e6c4;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 700;
    box-shadow: 0 10px 26px rgba(58, 15, 22, 0.25);
    text-align: center;
    line-height: 1.15;
    padding: 0.4rem;
  }
  .center-medallion small { display: block; font-size: 0.55em; font-weight: 600; color: #e7c98e; margin-top: 0.15em; }

  .node {
    position: absolute;
    width: 11%;
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--color-gold);
    background: var(--color-surface);
    box-shadow: 0 2px 8px rgba(58,15,22,0.15);
    cursor: pointer;
    transition: transform 160ms ease, box-shadow 160ms ease;
    text-decoration: none;
  }
  .node:hover, .node:focus-visible { transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 6px 18px rgba(58,15,22,0.3); z-index: 5; }
  .node img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .node .badge {
    position: absolute; top: -2px; left: -2px;
    background: var(--color-primary); color: #f6e6c4;
    font-size: 0.6rem; font-weight: 700;
    width: 1.1em; height: 1.1em; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .node .label {
    position: absolute;
    top: 105%; left: 50%; transform: translateX(-50%);
    font-size: 0.62rem; font-weight: 700; color: var(--color-primary);
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 140ms ease;
    background: var(--color-surface);
    padding: 0.1rem 0.4rem;
    border-radius: 6px;
    border: 1px solid var(--color-border);
  }
  .node:hover .label, .node:focus-visible .label { opacity: 1; }

  footer { text-align: center; color: var(--color-muted); font-size: 0.8rem; padding: 2rem 1rem 3rem; }

  @media (max-width: 480px) {
    .node { width: 13%; }
    .center-medallion { width: 26%; }
  }
</style>
</head>
<body>
  <div class="demo-banner">DEMO — Concept A: आयुध चक्र (Wheel of Weapons). Production site untouched.</div>
  <header>
    <div class="eyebrow">श्री गणेशाच्या प्रत्येक आयुधामागील रंजक कथा</div>
    <h1>श्री गणेश आयुधे</h1>
    <p class="lead">बाप्पाभोवती चक्राकार मांडलेली २० आयुधे — कुठलेही आयुध स्पर्श करा, त्याची कहाणी उघडेल.</p>
  </header>

  <div class="wheel-wrap" id="wheel">
    <svg class="spokes" id="spokes"></svg>
    <div class="center-medallion">ॐ<small>गणेश आयुधे</small></div>
  </div>

  <footer>Concept A — पुढील / मागील item साठी वरच्या मेनूवर जा.</footer>

  <script>
    const items = [
      ["001","एकदंत","../media/item-001/design-ref.jpg"],
      ["002","पाश","../media/item-002/design-ref.jpg"],
      ["003","अंकुश","../media/item-003/ankush.jpg"],
      ["004","परशू","../media/item-004/design-ref.jpg"],
      ["005","सुदर्शन चक्र","../media/item-005/design-ref.jpg"],
      ["006","गदा","../media/item-006/design-ref.jpg"],
      ["007","खड्ग","../media/item-007/design-ref.jpg"],
      ["008","त्रिशूळ","../media/item-008/design-ref.jpg"],
      ["009","खट्वांग","../media/item-009/design-ref.jpg"],
      ["010","मुद्गर","../media/item-010/design-ref.jpg"],
      ["011","कुंत","../media/item-011/design-ref.jpg"],
      ["012","धनुष्य","../media/item-012/design-ref.jpg"],
      ["013","बाण","../media/item-013/design-ref.jpg"],
      ["014","इक्षुकार्मुक","../media/item-014/design-ref.jpg"],
      ["016","वज्रशूळ","../media/item-016/design-ref.jpg?v=2"],
      ["017","वेताळ अस्त्र","../media/item-017/design-ref.jpg?v=2"],
      ["018","खेटक","../media/item-018/design-ref.jpg?v=2"],
      ["020","पाषाणधारण","../media/item-020/design-ref.jpg?v=2"],
      ["021","नांगर","../media/item-021/design-ref.jpg?v=2"],
      ["023","अग्नी","../media/item-023/design-ref.jpg?v=2"],
    ];
    const DEV = ['०','१','२','३','४','५','६','७','८','९'];
    const toDev = (n) => String(n).replace(/[0-9]/g, d => DEV[+d]);

    const wheel = document.getElementById('wheel');
    const svg = document.getElementById('spokes');
    const R = 42; // radius in %
    const cx = 50, cy = 50;

    items.forEach((it, i) => {
      const angle = (i / items.length) * 2 * Math.PI - Math.PI / 2;
      const x = cx + R * Math.cos(angle);
      const y = cy + R * Math.sin(angle);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx + '%'); line.setAttribute('y1', cy + '%');
      line.setAttribute('x2', x + '%'); line.setAttribute('y2', y + '%');
      svg.appendChild(line);

      const a = document.createElement('a');
      a.className = 'node';
      a.style.left = x + '%';
      a.style.top = y + '%';
      a.href = `../?id=${it[0]}`;
      a.innerHTML = `<span class="badge">${toDev(i+1)}</span><img src="${it[2]}" alt="" loading="lazy" /><span class="label">${it[1]}</span>`;
      wheel.appendChild(a);
    });
  </script>
</body>
</html>

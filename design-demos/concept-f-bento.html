<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept F — बेन्टो पेटी</title>
<style>
  :root {
    --color-bg: #fbf1de; --color-surface: #fff9ec; --color-text: #3a0f16;
    --color-muted: #7a5c46; --color-primary: #7a1e2b; --color-gold: #8f6224;
    --color-gold-soft: rgba(143,98,36,.14); --color-border: rgba(143,98,36,.32);
    --shadow-sm: 0 2px 8px rgba(58,15,22,.1); --shadow-md: 0 12px 28px rgba(58,15,22,.2);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); color:var(--color-text); background:var(--color-bg); }
  .demo-banner { background:var(--color-primary); color:#f6e6c4; text-align:center; font-size:.8rem; padding:.5rem; }
  header { text-align:center; padding:1.75rem 1rem 1rem; }
  .eyebrow { color:var(--color-gold); font-weight:700; font-size:.85rem; }
  h1 { color:var(--color-primary); font-size:1.9rem; margin:.3rem 0 .35rem; }
  .lead { color:var(--color-muted); font-size:.9rem; margin:0 0 1.25rem; }

  .bento {
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 120px;
    gap: .7rem;
    width:min(94vw, 720px);
    margin: 0 auto 3rem;
  }
  .tile {
    position:relative; border-radius:16px; overflow:hidden;
    background:var(--color-surface); border:1px solid var(--color-border);
    box-shadow:var(--shadow-sm); text-decoration:none; color:#fff;
    transform-style: preserve-3d; will-change: transform;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .tile:hover { box-shadow: var(--shadow-md); z-index:2; }
  .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .tile .veil {
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(58,15,22,.78) 0%, rgba(58,15,22,.15) 55%, transparent 80%);
  }
  .tile .cap { position:absolute; left:.7rem; bottom:.55rem; right:.6rem; }
  .tile .num { font-size:.68rem; color:#e7c98e; font-weight:700; }
  .tile .title { font-weight:700; line-height:1.15; }
  .tile.hero { grid-column: span 2; grid-row: span 2; }
  .tile.hero .title { font-size:1.15rem; }
  .tile.wide { grid-column: span 2; grid-row: span 1; }
  .tile:not(.hero):not(.wide) .title { font-size: .82rem; }

  @media (max-width: 560px) {
    .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 130px; }
    .tile.hero { grid-column: span 2; grid-row: span 2; }
    .tile.wide { grid-column: span 2; grid-row: span 1; }
  }
</style>
</head>
<body>
  <div class="demo-banner">DEMO — Concept F: बेन्टो पेटी (Asymmetric bento grid). Production site untouched.</div>
  <header>
    <div class="eyebrow">श्री गणेशाच्या प्रत्येक आयुधामागील रंजक कथा</div>
    <h1>श्री गणेश आयुधे</h1>
    <p class="lead">छोट्या-मोठ्या चौकटींची रचना — नजर आपोआप महत्त्वाच्या आयुधांकडे जाते. टाईलवर बोट/माउस फिरवून बघा.</p>
  </header>

  <div class="bento" id="bento"></div>

  <script>
    const items = [
      ["001","एकदंत","../media/item-001/design-ref.jpg","hero"],
      ["002","पाश","../media/item-002/design-ref.jpg",""],
      ["003","अंकुश","../media/item-003/ankush.jpg",""],
      ["004","परशू","../media/item-004/design-ref.jpg","wide"],
      ["005","सुदर्शन चक्र","../media/item-005/design-ref.jpg",""],
      ["006","गदा","../media/item-006/design-ref.jpg",""],
      ["007","खड्ग","../media/item-007/design-ref.jpg","hero"],
      ["008","त्रिशूळ","../media/item-008/design-ref.jpg",""],
      ["009","खट्वांग","../media/item-009/design-ref.jpg",""],
      ["010","मुद्गर","../media/item-010/design-ref.jpg","wide"],
      ["011","कुंत","../media/item-011/design-ref.jpg",""],
      ["012","धनुष्य","../media/item-012/design-ref.jpg",""],
      ["013","बाण","../media/item-013/design-ref.jpg",""],
      ["014","इक्षुकार्मुक","../media/item-014/design-ref.jpg","hero"],
      ["016","वज्रशूळ","../media/item-016/design-ref.jpg?v=2",""],
      ["017","वेताळ अस्त्र","../media/item-017/design-ref.jpg?v=2",""],
      ["018","खेटक","../media/item-018/design-ref.jpg?v=2","wide"],
      ["020","पाषाणधारण","../media/item-020/design-ref.jpg?v=2",""],
      ["021","नांगर","../media/item-021/design-ref.jpg?v=2",""],
      ["023","अग्नी","../media/item-023/design-ref.jpg?v=2",""],
    ];
    const DEV = ['०','१','२','३','४','५','६','७','८','९'];
    const toDev = (n) => String(n).replace(/[0-9]/g, d => DEV[+d]);

    const bento = document.getElementById('bento');
    items.forEach((it, i) => {
      const a = document.createElement('a');
      a.className = 'tile ' + it[3];
      a.href = `../?id=${it[0]}`;
      a.innerHTML = `<img src="${it[2]}" alt="" loading="lazy" /><span class="veil"></span><span class="cap"><span class="num">${toDev(i+1)}</span><br/><span class="title">${it[1]}</span></span>`;
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - 0.5;
        const py = (e.clientY - r.top) / r.height - 0.5;
        a.style.transform = `perspective(500px) rotateX(${py * -8}deg) rotateY(${px * 8}deg) scale(1.03)`;
      });
      a.addEventListener('pointerleave', () => { a.style.transform = ''; });
      bento.appendChild(a);
    });
  </script>
</body>
</html>

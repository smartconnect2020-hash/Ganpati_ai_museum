  <!-- Structured data (JSON-LD): self-contained, fetches data.json itself so it
       never depends on app.js's render pipeline or timing. -->
  <script>
    fetch('data.json').then((r) => r.json()).then((data) => {
      var base = 'https://smartconnect2020-hash.github.io/Ganpati_ai_museum/';
      var id = new URLSearchParams(location.search).get('id');
      var item = id ? data.items.find(function (it) { return it.id === id; }) : null;
      var graph = [{ '@type': 'WebSite', name: data.meta.site_title.mr, url: base }];
      if (item) {
        graph.push({
          '@type': 'CreativeWork',
          name: item.title.mr,
          description: item.story.mr,
          url: base + '?id=' + item.id,
          image: (function () {
            if (item.symbol) return base + item.symbol;
            var real = (item.images || []).find(function (src) { return src.indexOf('design-ref') === -1; });
            return real ? base + real : (item.images && item.images[0] ? base + item.images[0] : undefined);
          })(),
          inLanguage: 'mr',
          isPartOf: { '@type': 'WebSite', name: data.meta.site_title.mr, url: base }
        });
      } else {
        graph.push({
          '@type': 'ItemList',
          itemListElement: data.items.map(function (it, i) {
            return { '@type': 'ListItem', position: i + 1, name: it.title.mr, url: base + '?id=' + it.id };
          })
        });
      }
      var s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
      document.head.appendChild(s);
    }).catch(function () { /* schema is a bonus, never block the page on it */ });
  </script>

  <script>
    /* sw.js already calls skipWaiting()+clients.claim(), so a new SW takes
       over the moment it finishes installing — but that alone only affects
       *future* fetches, not the HTML/JS this page already loaded with. A
       returning visitor was stuck seeing the old version until they hard-
       refreshed by hand. Fix: nudge the browser to check for a new sw.js
       right away (register()'s own update check can otherwise sit for a
       while), and reload once — automatically — the moment a new SW
       actually takes control. hadController distinguishes a genuine update
       (reload) from this page's very first-ever install (no reload needed;
       content is already fresh since nothing was cached yet to be stale). */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var hadController = !!navigator.serviceWorker.controller;

        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) reg.update();
          });
        }).catch(function () {
          /* silent — offline optional on first visit */
        });

        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) { hadController = true; return; }
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
